worker_processes auto;

events {
    worker_connections 8192;   # WebSocket 1개 = 클라이언트 + 업스트림 2개 연결
}

http {
    # 세션 상태가 인스턴스 메모리에 없으므로(DB + Redis) sticky session 없이 라운드 로빈으로 분산한다.
    # Docker DNS 를 주기적으로 다시 조회한다(컨테이너 재생성으로 IP 가 바뀌어도 따라감).
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream app {
        zone app 64k;
        server app-1:8080 resolve max_fails=1 fail_timeout=5s;
        server app-2:8080 resolve max_fails=1 fail_timeout=5s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location /ws/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 120s;   # 클라이언트 ping(30s) 보다 길게
        }

        location / {
            proxy_pass http://app;
            proxy_set_header X-Request-Id $request_id;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
