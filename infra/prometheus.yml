global:
  scrape_interval: 5s

scrape_configs:
  - job_name: chat-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { instance_name: local }
  - job_name: chat-cluster
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081", "host.docker.internal:8082"]
