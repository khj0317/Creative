# 기본:            docker compose up -d                      → PostgreSQL + Redis (로컬 개발: ./gradlew bootRun)
# 수평 확장 데모:  docker compose --profile cluster up -d --build   → app-1, app-2 + Nginx(8088) + Redis Pub/Sub
# 관측성:          docker compose --profile observability up -d     → Prometheus(9090) + Grafana(3300)
name: realtime-session-replay

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5440:5432"
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app-1: &app
    profiles: ["cluster"]
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_HEALTH: "true"
      BROADCAST_MODE: redis
      INSTANCE_ID: app-1
      SNAPSHOT_INTERVAL: "100"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-2:
    <<: *app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_HEALTH: "true"
      BROADCAST_MODE: redis
      INSTANCE_ID: app-2
      SNAPSHOT_INTERVAL: "100"
    ports:
      - "8082:8080"

  lb:
    profiles: ["cluster"]
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - app-1
      - app-2

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
